version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: syncdesk-db
    environment:
      POSTGRES_USER: syncdesk
      POSTGRES_PASSWORD: syncdesk123
      POSTGRES_DB: syncdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncdesk -d syncdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
